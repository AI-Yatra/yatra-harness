[project]
name = "yatra-harness"
version = "1.0.0"
description = "A production-style, provider-neutral agent harness for the AI Yatra workshop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Yatra" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
harness = "harness.cli:main"
ay = "ay:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["harness", "ay.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".runs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = [
  "E501",
  "S603",
  "S607",
  "S310",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"harness/mcp_demo/server.py" = ["T201"]
"ay.py" = ["S101"]  # subprocess stdout invariant assertion

[dependency-groups]
dev = [
    "import-linter>=2.14",
    "openpyxl>=3.1.5",
    # The demo repository's suite is what a traced session is judged by, and it
    # is run with pytest. Without this the judgement is "pytest is missing",
    # which is not a verdict on the work.
    "pytest>=8.4",
    "ruff>=0.16.5",
]


# ── architecture ────────────────────────────────────────────────────────────
# The layering is enforced, not merely intended. Without a check like this a
# refactor's shape survives exactly until the first hurried import; the
# Acyclic Dependencies Principle is only worth stating if something fails
# when it is broken.
#
#   uv run lint-imports
#
[tool.importlinter]
root_package = "harness"
# A name used only in an annotation is not a runtime dependency: every module
# here has `from __future__ import annotations`, so those imports never
# execute. Counting them would report the composition root as a cycle it is
# not.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers depend downward only"
type = "layers"
# Highest first. `config` is the composition root: it imports every module it
# configures, so it sits with the entry points rather than at the bottom, and
# the modules below reach it through TYPE_CHECKING only.
layers = [
  "harness.repl",
  "harness.cli : harness.runtime : harness.doctor : harness.config",
  "harness.autonomy",
  "harness.run",
  "harness.execution",
  "harness.record",
  "harness.models",
  "harness.core",
]
ignore_imports = [
  # Deliberate deferred imports, made inside a function precisely so the
  # cycle does not exist at import time. Both are marked in the source.
  "harness.execution.workspace -> harness.run.session",
  "harness.run.subagents -> harness.config",
]

[[tool.importlinter.contracts]]
name = "core depends on nothing inside the package"
type = "forbidden"
source_modules = ["harness.core"]
forbidden_modules = [
  "harness.models", "harness.record", "harness.execution",
  "harness.run", "harness.autonomy", "harness.repl",
]

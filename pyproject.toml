[project]
name = "aiyatra-mini-harness"
version = "1.0.0"
description = "A production-style, provider-neutral agent harness for the AI Yatra workshop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Yatra" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".runs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = [
  "E501",
  "S603",
  "S607",
  "S310",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"harness/mcp_demo/server.py" = ["T201"]
"harness_chat.py" = ["S101"]  # subprocess stdout invariant assertion

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "ruff>=0.16.5",
]


version: 1
id: repository-edit
instructions: >-
  You are making a specific, requested change to this repository. The task
  objective is the request; it is not a puzzle and there is no hidden bug to
  find. Do not ask for clarification when the objective names what to change.

  Work in this order. Read the repository first: use repo_tree and
  search_repo to locate the file the objective refers to, and read_file to
  see its surrounding style before editing. Then make the smallest patch
  that satisfies the objective, matching the conventions already in the file
  rather than importing your own. If the repository has an AGENTS.md, its
  conventions are binding.

  Change only what the objective asks for. Do not reformat untouched lines,
  do not fix unrelated problems you notice, and do not modify anything under
  a protected path. Use git_diff to check what you have actually changed
  before finishing.

  Call finish when the change is made. The harness will verify it
  independently, and a failed verification comes back to you with the reason
  -- repair the existing patch from that reason rather than starting again.
allowed_tools:
  - repo_tree
  - search_repo
  - read_file
  - apply_patch
  - run_command
  - git_diff
  - finish

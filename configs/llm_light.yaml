version: 1
runs_dir: ../.runs

budgets:
  max_turns: 14
  max_tool_calls: 24
  max_seconds: 300
  max_context_chars: 24000
  max_output_chars: 12000
  max_verification_attempts: 3

# Each route declares two kinds of attribute:
#   transport  -- kind, base_url, api_key_env: how to reach it
#   routing    -- cost/latency/quality/context/tool_support: how to rank it
# LLM Light only ever sees the second group.
model_router:
  primary: teaching
  fallbacks: []
  retries_per_route: 1
  backoff_seconds: 0.05
  circuit_breaker_failures: 2
  routes:
    teaching:
      kind: replay
      model: deterministic-repair-demo
      script: ../scenarios/repair_demo.yaml
      timeout_seconds: 5
      local: true
      latency: low
      quality: 0.0
      context_window: 32768
    broken:
      kind: replay
      model: deterministic-failure
      script: ../scenarios/provider_failure.yaml
      timeout_seconds: 5
      local: true
      latency: low
      quality: 0.0
      context_window: 32768
    local-ollama:
      kind: ollama
      model: qwen2.5-coder:3b
      base_url: http://127.0.0.1:11434/v1
      timeout_seconds: 60
      local: true
      cost_per_1m_input: 0.0
      cost_per_1m_output: 0.0
      latency: medium
      quality: 2.5
      context_window: 32768
    local-vllm:
      kind: vllm
      model: local-coder
      base_url: http://127.0.0.1:8000/v1
      timeout_seconds: 60
      local: true
      cost_per_1m_input: 0.0
      cost_per_1m_output: 0.0
      latency: low
      quality: 3.0
      context_window: 16384
    remote-cheap:
      kind: openai_compatible
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      timeout_seconds: 60
      local: false
      cost_per_1m_input: 0.15
      cost_per_1m_output: 0.60
      latency: low
      quality: 3.5
      context_window: 128000
    remote-frontier:
      kind: anthropic
      model: claude-sonnet-4-6
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY
      timeout_seconds: 90
      local: false
      cost_per_1m_input: 3.0
      cost_per_1m_output: 15.0
      latency: medium
      quality: 5.0
      context_window: 200000

# LLM Light turns declared priorities into an ordered route plan. It decides
# the ORDER; the router still decides retries, backoff, and circuit breaking.
llm_light:
  enabled: true
  mode: lexicographic
  priorities: [privacy, quality, cost, latency]
  constraints:
    require_local: false
    require_tools: true
    min_context_window: 0
  profiles:
    # Nothing leaves the machine. Use for regulated code or a captive workshop.
    offline:
      mode: lexicographic
      priorities: [privacy, quality, latency, cost]
      constraints:
        require_local: true
    # Cheapest route that can still do the job.
    budget:
      mode: lexicographic
      priorities: [cost, quality, latency, privacy]
    # Best available model regardless of price.
    quality:
      mode: lexicographic
      priorities: [quality, latency, privacy, cost]
    # Exercises where the demo must be byte-identical on every laptop. The
    # replay route is pinned by an explicit allowlist so a participant who
    # happens to be running vLLM still sees the scripted scenario.
    teaching:
      mode: lexicographic
      priorities: [privacy, quality, cost, latency]
      constraints:
        allowed: [teaching]
    # Balance several goals at once instead of ranking them strictly.
    balanced:
      mode: weighted
      weights:
        quality: 0.45
        cost: 0.30
        latency: 0.15
        privacy: 0.10
    # Tasks whose context will not fit in a small local window.
    long-context:
      mode: lexicographic
      priorities: [context, quality, cost, latency]
      constraints:
        min_context_window: 100000

policy:
  approval_mode: never
  allowed_commands:
    - [python, -m, unittest]
    - [git, diff]
    - [git, status]
  network_enabled: false
  allowed_domains: []
  command_timeout_seconds: 30
  browser_timeout_seconds: 10

mcp:
  - name: repo-stats
    command: ["{python}", -m, harness.mcp_demo.server]
    protocol_version: "2025-11-25"
    timeout_seconds: 10
    enabled: true

context:
  recent_observations: 5
  repo_entries: 100

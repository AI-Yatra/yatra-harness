version: 1
runs_dir: ../.runs

budgets:
  max_turns: 16
  max_tool_calls: 28
  max_seconds: 1800
  max_context_chars: 32000
  max_output_chars: 12000
  max_verification_attempts: 3

model_router:
  primary: remote-qwen
  fallbacks: [teaching]
  retries_per_route: 2
  backoff_seconds: 1.0
  circuit_breaker_failures: 3
  routes:
    remote-qwen:
      kind: openai_compatible
      # qwen-plus and qwen-turbo return HTTP 403 on a free-tier-only account
      # once their allowance is spent. qwen3-coder-plus is verified working.
      model: qwen3-coder-plus
      base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      timeout_seconds: 120
      local: false
      cost_per_1m_input: 0.0
      cost_per_1m_output: 0.0
      latency: medium
      quality: 3.5
      context_window: 131072
    teaching:
      kind: replay
      script: ../scenarios/repair_demo.yaml
      local: true
      latency: low
      quality: 3.0
      context_window: 32768

policy:
  approval_mode: mutations
  allowed_commands:
    - [python, verify_contact_workbook.py]
    - [python, -m, unittest]
    - [git, diff]
    - [git, status]
    - [python, build_workbook.py]
    - [python, -I, build_workbook.py]
  network_enabled: false
  allowed_domains: []
  command_timeout_seconds: 60
  browser_timeout_seconds: 10

mcp:
  - name: repo-stats
    command: ["{python}", -m, harness.mcp_demo.server]
    protocol_version: "2025-11-25"
    timeout_seconds: 10
    enabled: true

context:
  recent_observations: 6
  repo_entries: 120

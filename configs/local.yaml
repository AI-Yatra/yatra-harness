version: 1
runs_dir: ../.runs

budgets:
  max_turns: 16
  max_tool_calls: 30
  max_seconds: 600
  max_context_chars: 32000
  max_output_chars: 12000
  max_verification_attempts: 3

model_router:
  primary: local-ollama
  fallbacks: [teaching]
  retries_per_route: 1
  backoff_seconds: 0.25
  circuit_breaker_failures: 2
  routes:
    local-ollama:
      kind: ollama
      model: qwen2.5-coder:3b
      base_url: http://127.0.0.1:11434/v1
      timeout_seconds: 90
      local: true
      latency: medium
      quality: 2.5
      context_window: 32768
    local-vllm:
      kind: vllm
      model: local-coder
      base_url: http://127.0.0.1:8000/v1
      timeout_seconds: 90
      local: true
      latency: low
      quality: 3.0
      context_window: 16384
    teaching:
      kind: replay
      model: deterministic-repair-demo
      script: ../scenarios/repair_demo.yaml
      timeout_seconds: 5
      local: true
      latency: low
      quality: 0.0
      context_window: 32768

policy:
  approval_mode: mutations
  allowed_commands:
    - [python, -m, unittest]
    - [git, diff]
    - [git, status]
  network_enabled: false
  allowed_domains: []
  command_timeout_seconds: 45
  browser_timeout_seconds: 10

mcp:
  - name: repo-stats
    command: ["{python}", -m, harness.mcp_demo.server]
    protocol_version: "2025-11-25"
    timeout_seconds: 10
    enabled: true

context:
  recent_observations: 6
  repo_entries: 120


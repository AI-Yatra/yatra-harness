name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The one component that cannot be exercised on a developer's Windows
      # machine. Without this the kernel-sandbox check skips everywhere, and a
      # confinement nobody has ever run is a claim rather than a control.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: uv sync
      - name: Lint
        run: uv run ruff check harness tests scripts ay.py docs/atlas/scripts
      # The layering is a claim; this is what makes it a fact. Without it the
      # package structure survives only until the first hurried import.
      - name: Architecture
        run: uv run lint-imports
      - name: Unit and end-to-end tests
        run: uv run python -m unittest discover -s tests -v
      # The unit suite proves the parts in isolation. This proves they are
      # wired together, by doing the thing rather than asserting it: a real
      # deny rule refusing a real call, a checkpoint restoring a real file, an
      # injected instruction failing to move the gate. It also runs the checks
      # that skip on Windows, so the kernel sandbox is exercised somewhere.
      - name: Component evidence
        run: uv run python scripts/evidence.py

      - name: Doctor
        run: uv run harness doctor --config configs/teaching.yaml --task tasks/repair_counter.yaml --skill skills/bugfix.yaml
      - name: Deterministic teaching run
        run: uv run harness run tasks/repair_counter.yaml --config configs/teaching.yaml --skill skills/bugfix.yaml
      # The unit suite proves each part behaves. This proves a run still
      # finishes the task, which is the thing a prompt or budget change
      # breaks without breaking a single unit test.
      - name: Eval suite
        run: uv run harness eval evals/teaching.yaml

  # The one-line install, run the way a stranger runs it: on a machine with no
  # clone, from the checked-out script, into a real shell.
  #
  # This exists because the package was not installable standalone and nothing
  # noticed. `uv sync` and the whole suite above pass from inside a clone,
  # where the config sits next to the code. A wheel that omits `configs/`
  # installs perfectly and then dies on first run. Only installing it somewhere
  # else and starting it catches that, so that is what this does.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install from the script (POSIX)
        if: runner.os != 'Windows'
        env:
          AY_SOURCE: ${{ github.workspace }}
        run: sh install.sh

      - name: Install from the script (Windows)
        if: runner.os == 'Windows'
        env:
          AY_SOURCE: ${{ github.workspace }}
        shell: pwsh
        run: ./install.ps1

      # Away from the checkout, because the fault this guards against is
      # exactly a config found only because the repository happened to be the
      # working directory. The commands are located by path rather than through
      # `uv`, since the installer may have just put uv somewhere this shell's
      # PATH does not yet know about, which is the normal first-install case.
      - name: Run ay from an unrelated directory
        shell: bash
        run: |
          set -eu
          AY=""
          for candidate in "$HOME/.local/bin/ay" "$HOME/.local/bin/ay.exe"; do
            if [ -x "$candidate" ]; then AY="$candidate"; break; fi
          done
          if [ -z "$AY" ]; then
            echo "ay was not installed into ~/.local/bin"
            ls -la "$HOME/.local/bin" || true
            exit 1
          fi
          mkdir -p "$HOME/elsewhere"
          cd "$HOME/elsewhere"
          printf '/exit\n' | "$AY" | tee output.txt
          grep -q "AI-Yatra" output.txt
          "$(dirname "$AY")/harness" --help > /dev/null
          echo "ay and harness both run outside the checkout"

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The one component that cannot be exercised on a developer's Windows
      # machine. Without this the kernel-sandbox check skips everywhere, and a
      # confinement nobody has ever run is a claim rather than a control.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - run: uv sync
      - name: Lint
        run: uv run ruff check harness tests scripts ay.py docs/atlas/scripts
      # The layering is a claim; this is what makes it a fact. Without it the
      # package structure survives only until the first hurried import.
      - name: Architecture
        run: uv run lint-imports
      - name: Unit and end-to-end tests
        run: uv run python -m unittest discover -s tests -v
      # The unit suite proves the parts in isolation. This proves they are
      # wired together, by doing the thing rather than asserting it: a real
      # deny rule refusing a real call, a checkpoint restoring a real file, an
      # injected instruction failing to move the gate. It also runs the checks
      # that skip on Windows, so the kernel sandbox is exercised somewhere.
      - name: Component evidence
        run: uv run python scripts/evidence.py

      - name: Doctor
        run: uv run harness doctor --config configs/teaching.yaml --task tasks/repair_counter.yaml --skill skills/bugfix.yaml
      - name: Deterministic teaching run
        run: uv run harness run tasks/repair_counter.yaml --config configs/teaching.yaml --skill skills/bugfix.yaml
      # The unit suite proves each part behaves. This proves a run still
      # finishes the task, which is the thing a prompt or budget change
      # breaks without breaking a single unit test.
      - name: Eval suite
        run: uv run harness eval evals/teaching.yaml

version: 1
id: demo-fix-winner
objective: >-
  winner() does not report a win on the anti-diagonal, the line running from
  the top-right cell to the bottom-left. Make that line win exactly as every
  other line does, without changing any other behaviour.
workspace_seed: ../tictactoe
constraints:
  - Read the failing test first; it names the case that is wrong.
  - Change implementation code only.
  - Keep the public function signatures unchanged.
protected_paths:
  - tests/**
acceptance:
  commands:
    - [python, -m, unittest, tests.test_winner]
  require_non_empty_diff: true
  timeout_seconds: 60
metadata:
  demo: logic-flaw

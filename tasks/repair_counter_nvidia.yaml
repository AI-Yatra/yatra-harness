version: 1
id: repair-counter-boundary-nvidia
objective: >-
  Repair the clamp function so values below the configured lower bound are
  clamped to that bound while preserving the existing upper-bound and
  validation behavior.
workspace_seed: ../fixtures/buggy_counter
constraints:
  - Inspect the repository before modifying it.
  - Modify implementation code only; do not modify tests.
  - Use the configured acceptance command as the completion criterion.
  - Keep the public function signature unchanged.
protected_paths:
  - tests/**
acceptance:
  commands:
    - [python, -m, unittest, discover, -s, tests, -v]
  require_non_empty_diff: true
  timeout_seconds: 30
metadata:
  workshop_module: feature-test-nvidia
  difficulty: introductory
  notes: |
    Identical objective to repair_counter.yaml, used for live-model feature
    tests so the seeded workshop run remains untouched.
